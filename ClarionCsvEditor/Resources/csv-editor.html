<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="utf-8">
    <title>CSV Editor</title>

    <!-- INJECT_TABULATOR_CSS -->
    <link rel="stylesheet" href="csv-editor.css">
</head>
<body>
    <div class="toolbar">
        <button onclick="addRow()" title="Add a row below the selection">+ Row</button>
        <button onclick="deleteSelectedRows()" title="Delete selected rows">- Row</button>
        <button onclick="addColumn()" title="Add a column">+ Col</button>
        <button onclick="deleteSelectedColumns()" title="Delete selected column(s)">- Col</button>
        <span class="sep"></span>
        <button onclick="doUndo()" title="Undo (Ctrl+Z)">&#8634;</button>
        <button onclick="doRedo()" title="Redo (Ctrl+Y)">&#8635;</button>
        <span class="sep"></span>
        <label class="toggle" title="Treat the first row as column headers">
            <input type="checkbox" id="headerToggle" checked onchange="toggleHeader()">
            First row is header
        </label>
        <label class="toggle" title="Field delimiter">
            Delim
            <select id="delimiter" onchange="changeDelimiter(this.value)">
                <option value=",">, comma</option>
                <option value=";">; semicolon</option>
                <option value="tab">&#8677; tab</option>
                <option value="|">| pipe</option>
            </select>
        </label>
        <button id="findBtn" onclick="openFind(false)" title="Find / Replace (Ctrl+F)">&#128269; Find</button>
        <span class="spacer"></span>
        <button id="darkBtn" onclick="toggleDark()" title="Toggle dark mode">🌓 Dark</button>
        <span class="status" id="status">No file loaded</span>
    </div>

    <div class="grid-wrap">
        <div id="findPanel" class="find-panel" hidden>
            <div class="find-row">
                <input type="search" id="search" class="find-input" placeholder="Find&#8230;"
                       oninput="applySearch(this.value)" title="Filter to rows containing this text">
                <label class="toggle" title="Match case for find and replace">
                    <input type="checkbox" id="matchCase"
                           onchange="applySearch(document.getElementById('search').value)"> Aa
                </label>
                <button class="find-close" onclick="closeFind()" title="Close (Esc)">&#215;</button>
            </div>
            <div class="find-row">
                <input type="text" id="replace" class="find-input" placeholder="Replace&#8230;"
                       title="Replacement text for Replace All">
                <button onclick="replaceAll()" title="Replace all occurrences of Find with Replace">Replace All</button>
            </div>
        </div>
        <div id="grid"></div>
    </div>

    <!-- INJECT_TABULATOR_JS -->
    <!-- INJECT_PAPAPARSE_JS -->
    <script src="csv-editor.js"></script>
</body>
</html>
